version: "2"
run:
  tests: true
  allow-parallel-runners: true

linters:
  default: all
  disable:
    # Deprecated linters
    - wsl
    - gomodguard
    - exhaustruct
    # Disabled due to the project policy
    - depguard
    - testpackage
    - gochecknoglobals
  settings:
    paralleltest:
      ignore-missing: false
    varnamelen:
      ignore-names:
        - ok
        - t
        - tt
